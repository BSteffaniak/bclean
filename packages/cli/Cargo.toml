[package]
name = "bclean_cli"
description = "Command-line interface for bclean"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
anyhow = { workspace = true, features = ["std"] }
bclean_actions = { workspace = true }
bclean_client = { workspace = true }
bclean_config = { workspace = true }
bclean_daemon = { workspace = true }
bclean_engine = { workspace = true }
bclean_index = { workspace = true }
bclean_model = { workspace = true }
bclean_protocol = { workspace = true }
bclean_rules = { workspace = true }
bclean_staleness = { workspace = true }
bclean_tree = { workspace = true }
bclean_tui = { workspace = true }
clap = { workspace = true }
log = { workspace = true }
parking_lot = { workspace = true }
pretty_env_logger = { workspace = true }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
toml = { workspace = true, features = ["display", "std"] }

[dev-dependencies]
tempfile = { workspace = true }

[features]
default = []
fail-on-warnings = [
    "bclean_actions/fail-on-warnings",
    "bclean_client/fail-on-warnings",
    "bclean_config/fail-on-warnings",
    "bclean_daemon/fail-on-warnings",
    "bclean_engine/fail-on-warnings",
    "bclean_index/fail-on-warnings",
    "bclean_model/fail-on-warnings",
    "bclean_protocol/fail-on-warnings",
    "bclean_rules/fail-on-warnings",
    "bclean_staleness/fail-on-warnings",
    "bclean_tree/fail-on-warnings",
    "bclean_tui/fail-on-warnings",
]
