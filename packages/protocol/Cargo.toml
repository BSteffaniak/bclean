[package]
name = "bclean_protocol"
description = "Versioned IPC protocol messages between bclean clients and the daemon"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
bclean_model = { workspace = true }
interprocess = { workspace = true, features = ["tokio"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util"] }

[dev-dependencies]
tokio = { workspace = true, features = [
    "io-util",
    "macros",
    "rt-multi-thread",
] }

[features]
default = []
fail-on-warnings = ["bclean_model/fail-on-warnings"]
