[package]
name = "bclean_daemon"
description = "bclean daemon: index ownership, watching, policies, alerts, and service install"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
bclean_actions = { workspace = true }
bclean_engine = { workspace = true }
bclean_protocol = { workspace = true }
bclean_watch = { workspace = true }
crossbeam-channel = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
    "signal",
] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Threading"] }

[dev-dependencies]
bclean_client = { workspace = true }
bclean_config = { workspace = true }
bclean_index = { workspace = true }
filetime = { workspace = true }
tempfile = { workspace = true }

[features]
default = []
fail-on-warnings = [
    "bclean_actions/fail-on-warnings",
    "bclean_engine/fail-on-warnings",
    "bclean_protocol/fail-on-warnings",
    "bclean_watch/fail-on-warnings",
]
