# Rust / Cargo build output and package caches.

[rules.cargo_target]
category = "rust"
description = "Cargo build output (target/ next to Cargo.toml)"
auto = true
confidence = "HIGH"
ephemeral = { kind = "BUILD_ARTIFACT", regen_cost = "CHEAP" }
stale = { project_idle = "30d" }
action = { kind = "COMMAND", run = "cargo clean", cwd = "{parent}", fallback = "DELETE" }
# Inside `[trim]` paths, only the runnable outputs survive: release binaries (also of
# cross-compiled targets) and the dynamic libraries next to them.
keep = [
  { glob = "release/*", executable = true },
  { glob = "*/release/*", executable = true },
  { glob = "release/*.{dylib,so,dll}" },
  { glob = "*/release/*.{dylib,so,dll}" },
]
# What Cargo and its usual companions create in target/. Profile and target-triple directories
# (custom ones included) are recognized by the markers Cargo leaves in them; anything else (a
# dev database kept in target/) is never cleaned with it.
owned = { names = [
  "debug", "release", "doc", "package", "tmp", "build", "deps", "examples", "incremental",
  ".fingerprint", "nextest", "criterion", "llvm-cov-target", "llvm-cov", "flycheck*",
  "rust-analyzer", "rust-project.json", ".rustc_info.json", "CACHEDIR.TAG", ".cargo-lock",
  ".package-cache",
], markers = [".fingerprint", ".cargo-lock", "incremental", "CACHEDIR.TAG"] }
[rules.cargo_target.match]
name = ["target"]
sibling_any = ["Cargo.toml"]
not_under = ["~/.cargo/**"]

[rules.cargo_registry_cache]
category = "rust"
description = "Downloaded crate archives (~/.cargo/registry/cache); re-downloaded on demand"
confidence = "HIGH"
priority = 10
ephemeral = { kind = "PACKAGE_CACHE", regen_cost = "NETWORK" }
action = { kind = "DELETE" }
[rules.cargo_registry_cache.match]
path = ["~/.cargo/registry/cache"]

[rules.cargo_registry_src]
category = "rust"
description = "Extracted crate sources (~/.cargo/registry/src); re-extracted from the cache on demand"
auto = true
confidence = "HIGH"
priority = 10
ephemeral = { kind = "PACKAGE_CACHE", regen_cost = "CHEAP" }
action = { kind = "DELETE" }
[rules.cargo_registry_src.match]
path = ["~/.cargo/registry/src"]

[rules.cargo_git_checkouts]
category = "rust"
description = "Checked-out git dependencies (~/.cargo/git/checkouts); recreated from the git db on demand"
confidence = "HIGH"
priority = 10
ephemeral = { kind = "PACKAGE_CACHE", regen_cost = "CHEAP" }
action = { kind = "DELETE" }
[rules.cargo_git_checkouts.match]
path = ["~/.cargo/git/checkouts"]

[rules.cargo_git_db]
category = "rust"
description = "Bare git dependency repositories (~/.cargo/git/db); re-cloned on demand"
confidence = "HIGH"
priority = 10
ephemeral = { kind = "PACKAGE_CACHE", regen_cost = "NETWORK" }
action = { kind = "DELETE" }
[rules.cargo_git_db.match]
path = ["~/.cargo/git/db"]

[rules.sccache_cache]
category = "rust"
description = "sccache compiler cache"
confidence = "HIGH"
priority = 10
ephemeral = { kind = "TOOL_CACHE", regen_cost = "CHEAP" }
action = { kind = "DELETE" }
[rules.sccache_cache.match]
path = [
    "~/Library/Caches/Mozilla.sccache",
    "~/.cache/sccache",
    "%LOCALAPPDATA%/Mozilla/sccache",
]
