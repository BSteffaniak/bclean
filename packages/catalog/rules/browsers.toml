[rules.electron_app_caches_windows]
category = "browsers"
description = "Embedded Chromium caches of Electron apps under %APPDATA%"
confidence = "MEDIUM"
priority = 5
ephemeral = { kind = "BROWSER_CACHE", regen_cost = "NETWORK" }
action = { kind = "DELETE" }
[rules.electron_app_caches_windows.match]
name = [
